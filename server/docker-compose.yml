# snapcal 개발용 MySQL 컨테이너
#
# ⭐ 이 파일은 git 에 커밋된다. 따라서 "비밀값"을 직접 적지 않는다.
#    실제 값은 .env 에 있고(= git 제외), 여기서는 ${변수명} 으로 참조만 한다.
#    docker compose 는 같은 폴더의 .env 를 자동으로 읽는다.
#
# 사용법 (server/ 폴더에서 실행):
#   docker compose up -d      DB 켜기
#   docker compose down       DB 끄기 (데이터는 볼륨에 남음)
#   docker compose down -v    DB 완전 초기화 (볼륨까지 삭제)
#   docker compose ps         상태 확인
#   docker compose logs -f    로그 실시간 보기

# ⭐ 프로젝트 이름을 명시적으로 고정한다.
#
# 생략하면 Compose 가 "이 파일이 있는 폴더 이름"을 프로젝트 이름으로 쓴다.
# 그러면 볼륨 이름이 server_xxx 가 되어 다른 프로젝트와 충돌하고,
# 폴더 이름을 바꾸는 순간 볼륨 이름이 달라져 데이터가 사라진 것처럼 보인다.
name: snapcal

services:
  mysql:
    # 버전 고정. 태그를 생략하면 latest 가 받아지는데, 그러면
    # 어느 날 갑자기 실험용 innovation 트랙(9.x)이 딸려올 수 있다.
    # 8.0 은 LTS 라서 배포 환경(Railway)과도 맞다.
    image: mysql:8.0

    container_name: snapcal-mysql
    restart: unless-stopped

    ports:
      # "접근허용IP:내컴퓨터포트:컨테이너포트"
      #
      # ⚠️ 앞의 127.0.0.1 이 중요하다. 이걸 빼고 '3306:3306' 이라고 쓰면
      #    0.0.0.0 (모든 네트워크) 에 열려서, 같은 와이파이에 있는 다른 사람이
      #    내 DB 에 접근을 시도할 수 있다. 127.0.0.1 을 붙이면 내 컴퓨터
      #    내부에서만 접속 가능해진다.
      #
      # 3306 이 이미 쓰이고 있다면 가운데만 3307 로 바꾸면 된다.
      - '127.0.0.1:3306:3306'

    environment:
      # ${변수} 는 .env 에서 값을 가져온다.
      # ':?메시지' 는 "값이 없으면 이 메시지와 함께 실행을 중단하라"는 뜻이다.
      # src/config/env.ts 의 required() 와 완전히 같은 Fail Fast 원칙.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?.env 에 MYSQL_ROOT_PASSWORD 가 없습니다}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?.env 에 MYSQL_DATABASE 가 없습니다}
      # 컨테이너 안의 시간대. 안 맞추면 UTC 라서 식단 기록이 9시간 어긋난다.
      TZ: Asia/Seoul

    command:
      # 한글과 이모지(🍚)를 제대로 저장하려면 utf8mb4 가 필수다.
      # MySQL 의 'utf8' 은 3바이트짜리 반쪽이라 이모지가 깨진다. (유명한 함정)
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

    volumes:
      # 컨테이너 안의 /var/lib/mysql (실제 데이터가 쌓이는 곳) 을
      # 이름 있는 볼륨에 연결한다. 컨테이너를 지웠다 다시 만들어도 데이터가 남는다.
      - snapcal-mysql-data:/var/lib/mysql

    healthcheck:
      # MySQL 은 컨테이너가 떠도 접속 가능해지기까지 10~20초 걸린다.
      # Docker 가 주기적으로 확인해서 "healthy" 여부를 알려준다.
      #
      # $$ 는 compose 가 치환하지 말고 컨테이너 안의 셸에게 넘기라는 뜻이다.
      # 즉 비밀번호가 이 파일에 노출되지 않는다.
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  snapcal-mysql-data:
